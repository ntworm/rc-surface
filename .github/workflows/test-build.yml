name: Test build

# Builds an installable .ablx from a work branch so a change can be tried in
# Live before it is merged or released. Nothing is published: the package is a
# workflow artifact (downloaded as a .zip holding the .ablx), kept 14 days.

on:
  push:
    branches-ignore: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build test package
    runs-on: windows-latest
    env:
      ABLETON_RC_DEV_SYNC: '0'
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: 'npm'

      - name: Fetch Ableton Extensions SDK tarballs (private vendor repository)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ntworm/rc-surface-vendor
          ssh-key: ${{ secrets.VENDOR_SDK_KEY }}
          path: .vendor-private

      - name: Stage and verify SDK tarballs
        run: node scripts/check-vendor-sdk.mjs --from .vendor-private

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Name the package after the commit
        id: package
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $sha = "${{ github.sha }}".Substring(0, 7)
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=RC-Surface-$version-test-$sha" >> $env:GITHUB_OUTPUT

      - name: Build and package extension
        run: npm run build:prod-ablx

      - name: Upload test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: RC-Surface-${{ steps.package.outputs.version }}.ablx
          if-no-files-found: error
          retention-days: 14
