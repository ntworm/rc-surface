name: IndexNow

# After GitHub Pages publishes a change to the landing pages, ask IndexNow
# search engines to recrawl them. See scripts/indexnow.mjs.

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  ping:
    name: Submit landing pages
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.build.status == 'built'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0

      # One push can carry several commits (a rebase merge, a batch of local
      # commits), so the build is compared with what the previous Pages build
      # published, not with HEAD~1.
      - name: Check whether the published pages changed
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BUILT: ${{ github.event.build.commit }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "submit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds?per_page=20" \
            --jq "[.[] | select(.status == \"built\" and .commit != \"$BUILT\") | .commit][0] // \"\"")
          if [ -z "$previous" ]; then
            echo "No earlier Pages build to compare with; submitting."
            echo "submit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$BUILT" --jq '.files[].filename')
          changed=$(printf '%s\n' "$files" | grep -xE 'docs/(index\.html|pt-br\.html|sitemap\.xml|llms\.txt)' || true)
          if [ -n "$changed" ]; then
            printf 'Changed since %s:\n%s\n' "$previous" "$changed"
            echo "submit=true" >> "$GITHUB_OUTPUT"
          else
            echo "Landing pages unchanged since $previous; nothing to submit."
          fi

      - name: Submit to IndexNow
        if: steps.changed.outputs.submit == 'true'
        run: node scripts/indexnow.mjs
