name: IndexNow

# After GitHub Pages publishes a change to the landing pages, ask IndexNow
# search engines to recrawl them. See scripts/indexnow.mjs.

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Submit landing pages
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.build.status == 'built'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0

      - name: Check whether the published pages changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || ! git diff --quiet HEAD~1 HEAD -- docs/index.html docs/pt-br.html docs/sitemap.xml docs/llms.txt; then
            echo "submit=true" >> "$GITHUB_OUTPUT"
          else
            echo "Landing pages unchanged in this build; nothing to submit."
          fi

      - name: Submit to IndexNow
        if: steps.changed.outputs.submit == 'true'
        run: node scripts/indexnow.mjs
