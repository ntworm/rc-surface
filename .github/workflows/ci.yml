name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  ci-multiplatform:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: 'npm'

      - name: Fetch Ableton Extensions SDK tarballs (private vendor repository)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ntworm/rc-surface-vendor
          ssh-key: ${{ secrets.VENDOR_SDK_KEY }}
          path: .vendor-private

      - name: Stage and verify SDK tarballs
        run: node scripts/check-vendor-sdk.mjs --from .vendor-private

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browser
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Run CI (lint, typecheck, test, build)
        run: npm run ci
